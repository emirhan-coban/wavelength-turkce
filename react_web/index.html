<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#1A1A1A" />
        <meta
            name="description"
            content="Zihindar - Türkçe Wavelength Parti Oyunu. Arkadaşlarınla eğlenceye hazır mısın?"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Zihindar" />
        <meta name="mobile-web-app-capable" content="yes" />

        <!-- Open Graph -->
        <meta property="og:title" content="Zihindar - Türkçe Wavelength" />
        <meta
            property="og:description"
            content="Arkadaşlarınla offline parti oyunu!"
        />
        <meta property="og:type" content="website" />

        <!-- Google Fonts: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />

        <title>Zihindar — Türkçe Wavelength</title>

        <style>
            /* Critical inline styles to prevent FOUC */
            html,
            body,
            #root {
                margin: 0;
                padding: 0;
                background-color: #111111;
                color: #ffffff;
                height: 100%;
                width: 100%;
                overflow: hidden;
            }
            /* Splash screen while JS loads */
            #splash {
                position: fixed;
                inset: 0;
                background: #1a1a1a;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                z-index: 9999;
                transition: opacity 0.3s ease;
            }
            #splash .logo {
                width: 72px;
                height: 72px;
                background: #ff6b00;
                border-radius: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 40px;
                font-weight: 900;
                color: white;
                font-family: "Inter", sans-serif;
            }
            #splash .name {
                font-family: "Inter", sans-serif;
                font-size: 24px;
                font-weight: 800;
                color: white;
                letter-spacing: 0.5px;
            }
            #splash .tagline {
                font-family: "Inter", sans-serif;
                font-size: 13px;
                color: #888888;
            }
            #splash.hidden {
                opacity: 0;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <!-- Splash screen -->
        <div id="splash">
            <div class="logo">Z</div>
            <div class="name">Zihindar</div>
            <div class="tagline">Türkçe Wavelength Parti Oyunu</div>
        </div>

        <div id="root"></div>

        <script type="module" src="/src/main.tsx"></script>

        <script>
            // Hide splash after React mounts
            window.addEventListener("load", function () {
                setTimeout(function () {
                    var splash = document.getElementById("splash");
                    if (splash) {
                        splash.classList.add("hidden");
                        setTimeout(function () {
                            splash.remove();
                        }, 350);
                    }
                }, 400);
            });
        </script>
    </body>
</html>
